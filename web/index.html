<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUT.GG Challenges</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239ce8bd'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' font-family='Arial' font-weight='bold' fill='%2310161d'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">F<span>·</span></span><div><strong data-i18n="Challenges">Challenges</strong><small>FUT.GG · FC 27</small></div></div>
    <div class="top-actions"><label class="language-control"><span data-i18n="Language">Language</span><select id="language" aria-label="Language" data-i18n-aria-label="Language"><option value="en">English</option><option value="ar">العربية</option></select></label><span id="source-date"></span><button id="reload" class="ghost" data-i18n="Refresh">Refresh</button></div>
  </header>
  <main>
    <div id="message" role="status" aria-live="polite"></div>
    <nav class="tabs" aria-label="Sections" data-i18n-aria-label="Sections"><button data-tab="daily" class="active"><span data-i18n="Today">Today</span></button><button data-tab="browse"><span data-i18n="Browse">Browse</span></button><button data-tab="selected"><span data-i18n="My list">My list</span> <span id="selected-count">0</span></button></nav>
    <section id="daily" class="panel active"><div class="section-heading"><h2 data-i18n="Today's match plan">Today's match plan</h2></div><div id="daily-planner"></div></section>
    <section id="browse" class="panel"><div class="section-heading"><h2 data-i18n="Browse">Browse</h2><span id="result-count" class="result-count"></span></div><div class="filters"><input id="search" type="search" placeholder="Search challenges or tasks" aria-label="Search challenges" data-i18n-placeholder="Search challenges or tasks" data-i18n-aria-label="Search challenges"><select id="sort" aria-label="Sort challenges" data-i18n-aria-label="Sort challenges"><option value="soonest" data-i18n="Soonest expiry">Soonest expiry</option><option value="rating" data-i18n="Highest player rating">Highest player rating</option><option value="coins" data-i18n="Most coins">Most coins</option><option value="pack" data-i18n="Best pack quality">Best pack quality</option></select><select id="category" aria-label="Category" data-i18n-aria-label="Category"><option value="" data-i18n="All categories">All categories</option></select><select id="availability" aria-label="Availability" data-i18n-aria-label="Availability"><option value="active" data-i18n="Active">Active</option><option value="all" data-i18n="All availability">All availability</option><option value="upcoming" data-i18n="Upcoming">Upcoming</option><option value="expired" data-i18n="Expired">Expired</option></select></div><div id="reward-filters" class="reward-filters" aria-label="Reward type" data-i18n-aria-label="Reward type"></div><details class="browse-insights"><summary data-i18n="Reward leaders">Reward leaders</summary><div id="reward-leaders"></div></details><div id="source-changes"></div><div id="browse-list" class="cards"></div></section>
    <section id="selected" class="panel"><div class="section-heading"><h2 data-i18n="My list">My list</h2></div><div id="selected-summary"></div><div id="selected-list" class="cards"></div><div id="backup-controls"></div></section>
  </main>
  </body>
</html>
